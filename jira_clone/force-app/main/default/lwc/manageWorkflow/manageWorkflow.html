<template>
    <lightning-card title="Manage Workflow" icon-name="standard:workflow">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </template>

        <template if:true={successMessage}>
            <lightning-alert variant="success" title="Success" class="slds-m-around_medium">{successMessage}</lightning-alert>
        </template>

        <template if:true={errorMessage}>
            <lightning-alert variant="error" title="Error" class="slds-m-around_medium">{errorMessage}</lightning-alert>
        </template>

        <template if:true={workflowData}>
            <div class="workflow-body">
                <h2 class="workflow-title">{workflowData.workflow.name}</h2>

                <lightning-layout multiple-rows="true">
                    <lightning-layout-item size="12" medium-device-size="8" large-device-size="8" padding="around-small">
                        <lightning-card title="Workflow Diagram">
                            <div class="diagram-list">
                                <template for:each={transitionsWithClasses} for:item="transition">
                                    <div
                                        key={transition.id}
                                        class={transition.cssClass}
                                        data-transition-id={transition.id}
                                        onclick={selectTransition}
                                    >
                                        <div class="transition-name">{transition.name}</div>
                                        <lightning-badge label={transition.recordStatus}></lightning-badge>
                                        <div class="transition-flow">
                                            {transition.fromStatus} → {transition.toStatus}
                                        </div>
                                    </div>
                                </template>

                                <lightning-button
                                    variant="brand"
                                    label="Add Transition"
                                    onclick={openAddTransitionModal}
                                    class="slds-m-top_medium"
                                ></lightning-button>
                            </div>
                        </lightning-card>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" medium-device-size="4" large-device-size="4" padding="around-small">
                        <lightning-card title="Pending Transitions" class="slds-m-bottom_medium">
                            <div class="sidebar-section">
                                <template if:true={pendingTransitions.length}>
                                    <template for:each={pendingTransitions} for:item="transition">
                                        <div key={transition.id} class="sidebar-item">
                                            <span class="sidebar-item__label">{transition.name}</span>
                                            <lightning-button
                                                variant="success"
                                                label="Activate"
                                                size="small"
                                                data-transition-id={transition.id}
                                                onclick={handleActivateTransition}
                                            ></lightning-button>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={pendingTransitions.length}>
                                    <p class="sidebar-empty">No pending transitions</p>
                                </template>
                            </div>
                        </lightning-card>

                        <template if:true={selectedTransition}>
                            <lightning-card title="Pending Validation Rules">
                                <div class="sidebar-section">
                                    <template if:true={pendingValidationRules.length}>
                                        <template for:each={pendingValidationRules} for:item="rule">
                                            <div key={rule.id} class="sidebar-item">
                                                <span class="sidebar-item__label">{rule.ticketField} ({rule.type})</span>
                                                <lightning-button-group>
                                                    <lightning-button
                                                        variant="success"
                                                        label="Activate"
                                                        size="small"
                                                        data-rule-id={rule.id}
                                                        onclick={handleActivateValidationRule}
                                                    ></lightning-button>
                                                    <lightning-button
                                                        variant="destructive"
                                                        label="Delete"
                                                        size="small"
                                                        data-rule-id={rule.id}
                                                        onclick={handleDeleteValidationRule}
                                                    ></lightning-button>
                                                </lightning-button-group>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={pendingValidationRules.length}>
                                        <p class="sidebar-empty">No pending validation rules</p>
                                    </template>

                                    <lightning-button
                                        variant="brand"
                                        label="Add Validation Rule"
                                        onclick={openAddValidationRuleModal}
                                        class="slds-m-top_medium"
                                    ></lightning-button>
                                </div>
                            </lightning-card>

                            <template if:true={activeValidationRules.length}>
                                <lightning-card title="Active Validation Rules" class="slds-m-top_medium">
                                    <div class="sidebar-section">
                                        <template for:each={activeValidationRules} for:item="rule">
                                            <div key={rule.id} class="sidebar-item">
                                                <lightning-badge label="active"></lightning-badge>
                                                <span class="sidebar-item__label">{rule.ticketField} ({rule.type})</span>
                                            </div>
                                        </template>
                                    </div>
                                </lightning-card>
                            </template>
                        </template>
                    </lightning-layout-item>
                </lightning-layout>

                <lightning-button
                    variant="brand"
                    label="Update Workflow"
                    onclick={handleUpdateWorkflow}
                    class="slds-m-top_large"
                ></lightning-button>
            </div>
        </template>

        <template if:true={showAddValidationRuleModal}>
            <div class="modal-overlay">
                <lightning-card title="Add Validation Rule">
                    <div class="modal-body">
                        <lightning-combobox
                            name="ticketField"
                            label="Ticket Field"
                            value={newValidationRule.ticketField}
                            options={ticketFieldOptions}
                            onchange={handleTicketFieldChange}
                            required
                            class="slds-m-bottom_small"
                        ></lightning-combobox>
                        <lightning-combobox
                            name="validationType"
                            label="Validation Type"
                            value={newValidationRule.type}
                            options={validationTypeOptions}
                            onchange={handleValidationTypeChange}
                            required
                        ></lightning-combobox>
                    </div>
                    <div slot="footer" class="modal-footer">
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            onclick={closeAddValidationRuleModal}
                            class="slds-m-right_small"
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Add Rule"
                            onclick={handleAddValidationRule}
                        ></lightning-button>
                    </div>
                </lightning-card>
            </div>
        </template>

        <template if:true={showAddTransitionModal}>
            <div class="modal-overlay">
                <lightning-card title="Add Workflow Transition">
                    <div class="modal-body">
                        <lightning-input
                            name="transitionName"
                            label="Transition Name"
                            value={newTransition.name}
                            onchange={handleTransitionNameChange}
                            required
                            class="slds-m-bottom_small"
                        ></lightning-input>
                        <lightning-combobox
                            name="fromStatus"
                            label="From Status"
                            value={newTransition.fromStatus}
                            options={statusOptions}
                            onchange={handleFromStatusChange}
                            required
                            class="slds-m-bottom_small"
                        ></lightning-combobox>
                        <lightning-combobox
                            name="toStatus"
                            label="To Status"
                            value={newTransition.toStatus}
                            options={statusOptions}
                            onchange={handleToStatusChange}
                            required
                        ></lightning-combobox>
                    </div>
                    <div slot="footer" class="modal-footer">
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            onclick={closeAddTransitionModal}
                            class="slds-m-right_small"
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Create Transition"
                            onclick={handleAddWorkflowTransition}
                        ></lightning-button>
                    </div>
                </lightning-card>
            </div>
        </template>
    </lightning-card>
</template>
