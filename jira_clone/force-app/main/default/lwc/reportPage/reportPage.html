<template>
    <section class="report">
        <header class="report__header">
            <h1 class="report__title">Sprint Report</h1>
            <template if:true={hasModel}>
                <p class="report__subtitle">
                    Committed {committedTotal} pts · {dayCount} days
                </p>
            </template>
        </header>

        <!-- View switcher: principal (burndown) and secondary (burn-up) -->
        <div class="report__cards">
            <div class={burndownCardClass}>
                <c-ao-card-button
                    value="burndown"
                    heading="Burndown"
                    description="Principal page — remaining work vs. the ideal line."
                    onselect={handleSelectView}>
                </c-ao-card-button>
            </div>
            <div class={burnupCardClass}>
                <c-ao-card-button
                    value="burnup"
                    heading="Burn-up"
                    description="Secondary page — committed scope vs. completed work."
                    onselect={handleSelectView}>
                </c-ao-card-button>
            </div>
        </div>

        <div class="report__body">
            <!-- Spinner overlays the charts while loading -->
            <template if:true={isLoading}>
                <div class="report__overlay">
                    <lightning-spinner alternative-text="Loading report" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasError}>
                <p class="report__error">{errorMessage}</p>
            </template>

            <template if:true={isEmpty}>
                <p class="report__empty">No report data available for this sprint yet.</p>
            </template>

            <!-- Canvases stay mounted so Chart.js keeps its attachment; the
                 inactive panel is hidden with CSS rather than removed. -->
            <div class="report__charts">
                <div class={burndownPanelClass}>
                    <h2 class="report__chart-title">Burndown</h2>
                    <div class="report__canvas-wrap">
                        <canvas class="burndown-canvas"></canvas>
                    </div>
                </div>

                <div class={burnupPanelClass}>
                    <h2 class="report__chart-title">Burn-up</h2>
                    <div class="report__canvas-wrap">
                        <canvas class="burnup-canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </section>
</template>
